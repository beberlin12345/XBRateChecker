name: Collect Remittance Snapshots

on:
  schedule:
    # runs at 09:00, 15:00, and 21:00 UTC (roughly 4am, 10am, 4pm US Central)
    # adjust to whatever spread makes sense once you're tracking day/hour effects
    - cron: '0 9,15,21 * * *'
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab for testing

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python3 collect.py

      - name: Commit updated database
        run: |
          git config user.name "remittance-tracker-bot"
          git config user.email "actions@github.com"
          git add remittance_tracker.db
          git diff --staged --quiet || git commit -m "Add snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
